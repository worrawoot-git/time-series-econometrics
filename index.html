<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Series Econometrics Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f3f5f9; --card:#ffffff; --ink:#142033; --ink2:#46526a; --muted:#7b859a; --line:#dde3ee; --line2:#eef1f6;
  --acc:#1f56b8; --acc-d:#163f88; --acc-bg:#e9f0fc; --ok:#17784f; --ok-bg:#e4f4ec; --bad:#b8342f; --bad-bg:#fbe9e8;
  --warn:#9a6a00; --warn-bg:#fff4dc; --r:14px; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.hidden{display:none!important}
/* header */
.top{background:linear-gradient(120deg,#10284f 0%,#1a3f7d 55%,#22539e 100%);color:#fff;padding:22px 24px 20px}
.top-in{max-width:1220px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-family:var(--mono);font-size:22px;font-weight:500;border:1px solid rgba(255,255,255,.25)}
.brand h1{margin:0;font-size:21px;font-weight:700;letter-spacing:.1px}
.brand p{margin:2px 0 0;font-size:13.5px;opacity:.82}
.actions{display:flex;gap:10px;align-items:center}
.seg{display:inline-flex;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:#fff;padding:6px 14px;border-radius:999px;font-weight:500;font-size:14px}
.seg button.on{background:#fff;color:var(--acc-d)}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 16px;border-radius:10px;font-weight:500;display:inline-flex;align-items:center;gap:8px;transition:background .15s,border-color .15s,box-shadow .15s}
.btn:hover{border-color:#b9c3d6;background:#fafbfd}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{background:var(--acc-d)}
.btn.big{padding:12px 26px;font-size:16px;border-radius:12px}
.btn.reset{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.btn.reset:hover{background:rgba(255,255,255,.22)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn svg{width:16px;height:16px;flex:none}
main{max-width:1220px;margin:0 auto;padding:22px 16px 40px}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:18px;box-shadow:0 1px 2px rgba(20,32,51,.04);position:relative}
.step-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.step-h .num{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none}
.step-h h2{margin:0;font-size:18px;font-weight:600}
.step-h .hint{margin-left:auto;color:var(--muted);font-size:13px}
.step.locked{opacity:.55;pointer-events:none}
.step.locked .step-h .num{background:#a5afc2}
/* module cards */
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mod{border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;background:#fff;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:6px;transition:border-color .15s,box-shadow .15s,transform .1s}
.mod:hover{border-color:#9db4dd;box-shadow:0 3px 10px rgba(31,86,184,.08)}
.mod.on{border-color:var(--acc);background:var(--acc-bg);box-shadow:0 0 0 3px rgba(31,86,184,.12)}
.mod .tag{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--acc);background:#fff;border:1px solid #c9d7f1;border-radius:6px;padding:1px 7px;align-self:flex-start}
.mod b{font-size:15.5px;font-weight:600;line-height:1.35}
.mod span.d{font-size:13.3px;color:var(--ink2);line-height:1.5}
.mod-info{margin-top:16px;border:1px solid #cfdcf3;background:linear-gradient(180deg,#f6f9ff,#fff);border-radius:12px;padding:16px 18px}
.mod-info h3{margin:0 0 8px;font-size:16.5px}
.mod-info .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 22px}
.mod-info .grid div{font-size:14px;color:var(--ink2)}
.mod-info .grid div b{color:var(--ink);display:block;font-size:13px;font-weight:600;text-transform:none;margin-bottom:2px}
.eq{font-family:var(--mono);font-size:13px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:#22314d;display:block;margin-top:4px;overflow-x:auto;white-space:nowrap}
/* data */
.drop{display:block;border:2px dashed #b9c6dd;border-radius:12px;padding:22px;text-align:center;background:#fafbfe;transition:background .15s,border-color .15s;cursor:pointer}
.drop.over{background:var(--acc-bg);border-color:var(--acc)}
.drop b{display:block;font-size:15.5px;margin-bottom:2px}
.drop small{color:var(--muted)}
.data-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.fmt{font-size:13px;color:var(--ink2);background:var(--line2);border-radius:10px;padding:10px 12px;margin-top:12px}
.fmt code{font-family:var(--mono);font-size:12.5px}
.loaded{margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--ok-bg);color:var(--ok);border-radius:999px;padding:3px 11px;font-weight:500;font-size:13px}
.pill.gray{background:var(--line2);color:var(--ink2)}
.preview{margin-top:10px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px}
/* settings */
.sub-h{font-weight:600;font-size:14.5px;margin:4px 0 8px;color:var(--ink)}
.vars{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chk{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:14px;background:#fff;cursor:pointer;user-select:none}
.chk input{accent-color:var(--acc);width:15px;height:15px;margin:0}
.chk.on{border-color:var(--acc);background:var(--acc-bg)}
.note{font-size:12.8px;color:var(--muted);margin:4px 0 0}
.set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px 14px;margin-top:8px}
.fld label{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px;font-weight:500}
.fld input[type=number],.fld select{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink)}
.fld input:focus,.fld select:focus{outline:2px solid rgba(31,86,184,.25);border-color:var(--acc)}
.fld.cb{display:flex;align-items:flex-end}
.run-row{display:flex;justify-content:center;margin-top:20px;gap:12px;flex-wrap:wrap}
.err{background:var(--bad-bg);color:var(--bad);border:1px solid #f0c4c1;border-radius:10px;padding:10px 14px;margin-top:12px;font-size:14px}
.warnbox{background:var(--warn-bg);color:var(--warn);border:1px solid #f1dca6;border-radius:10px;padding:9px 13px;margin:0 0 12px;font-size:13.5px}
/* results */
.res-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.viewseg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:4px;background:var(--line2);gap:4px}
.viewseg button{border:0;background:transparent;padding:9px 18px;border-radius:9px;font-weight:600;color:var(--ink2);display:inline-flex;gap:8px;align-items:center}
.viewseg button.on{background:#fff;color:var(--acc);box-shadow:0 1px 3px rgba(20,32,51,.1)}
.viewseg svg{width:17px;height:17px}
.keybox{border-left:4px solid var(--acc);background:var(--acc-bg);border-radius:0 10px 10px 0;padding:11px 16px;margin-bottom:16px}
.keybox b{display:block;margin-bottom:4px;color:var(--acc-d)}
.keybox ul{margin:0;padding-left:20px}
.keybox li{margin:2px 0;font-size:14.3px}
.tcard{border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden;background:#fff}
.tcard h4{margin:0;padding:11px 16px;font-size:15px;background:#f7f9fc;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.tcard h4 .ix{font-family:var(--mono);color:var(--acc);font-size:13px;font-weight:500}
.tscroll{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:13.6px}
table.t th{background:#fbfcfe;color:var(--ink2);font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.t td.num{font-family:var(--mono);font-size:13px;text-align:right}
table.t th.num{text-align:right}
table.t tr:hover td{background:#fafcff}
table.t td.ok{color:var(--ok);font-weight:600;font-family:inherit}
table.t td.bad{color:var(--bad);font-weight:600;font-family:inherit}
table.t td.strong{font-weight:600}
.explain{padding:10px 16px 12px;background:#fcfcfd;border-top:1px solid var(--line);font-size:13.4px;color:var(--ink2)}
.explain b{color:var(--ink);font-size:13px}
.explain ul{margin:4px 0 0;padding-left:20px}
.explain li{margin:2px 0}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:14px}
.ccard{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px 12px;position:relative}
.ccard.wide{grid-column:1/-1}
.ccard .cbar{display:flex;justify-content:flex-end;margin-bottom:2px}
.ccard .cbox{position:relative;height:300px}
.ccard.wide .cbox{height:360px}
.ccard.sq .cbox{height:340px}
.loader{position:fixed;inset:0;background:rgba(243,245,249,.7);display:grid;place-items:center;z-index:50;backdrop-filter:blur(2px)}
.loader div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 26px;box-shadow:0 10px 30px rgba(20,32,51,.12);display:flex;gap:12px;align-items:center;font-weight:500}
.spin{width:22px;height:22px;border:3px solid var(--acc-bg);border-top-color:var(--acc);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
footer{max-width:1220px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:12.5px;text-align:center}
@media (max-width:640px){
  .top{padding:16px}
  .brand h1{font-size:17px}
  .step{padding:16px 14px}
  .chart-grid{grid-template-columns:1fr}
  .ccard .cbox{height:260px}
  .viewseg button{padding:8px 12px}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">
    <div class="logo">∂y</div>
    <div>
      <h1 data-th="ห้องปฏิบัติการเศรษฐมิติอนุกรมเวลา" data-en="Time Series Econometrics Lab"></h1>
      <p data-th="วิเคราะห์ข้อมูลอนุกรมเวลาขั้นสูง: ARIMA · Unit Root · Cointegration · VAR/VECM · IRF · GARCH" data-en="Advanced time-series analysis: ARIMA · Unit Root · Cointegration · VAR/VECM · IRF · GARCH"></p>
    </div>
  </div>
  <div class="actions">
    <div class="seg" role="group" aria-label="Language"><button id="btnTH" type="button">ไทย</button><button id="btnEN" type="button">English</button></div>
    <button class="btn reset" id="btnReset" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span data-th="รีเซ็ตหน้า" data-en="Reset"></span></button>
  </div>
</div></header>

<main>
  <section class="step" id="step1">
    <div class="step-h"><span class="num">1</span><h2 data-th="เลือกประเภทการวิเคราะห์" data-en="Choose an analysis"></h2></div>
    <div class="mod-grid" id="modGrid"></div>
    <div class="mod-info hidden" id="modInfo"></div>
  </section>

  <section class="step locked" id="step2">
    <div class="step-h"><span class="num">2</span><h2 data-th="นำเข้าข้อมูล" data-en="Load data"></h2><span class="hint" id="step2hint" data-th="เลือกการวิเคราะห์ก่อน" data-en="Choose an analysis first"></span></div>
    <label class="drop" id="drop">
      <input type="file" id="fileIn" accept=".xlsx,.xls,.csv" hidden>
      <b data-th="แนบไฟล์ Excel (.xlsx / .xls / .csv)" data-en="Attach an Excel file (.xlsx / .xls / .csv)"></b>
      <small data-th="คลิกเพื่อเลือกไฟล์ หรือ ลากไฟล์มาวางที่นี่" data-en="Click to browse or drag & drop a file here"></small>
    </label>
    <div class="data-actions">
      <button class="btn" id="btnSample" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/></svg><span id="btnSampleTxt"></span></button>
      <button class="btn" id="btnDlSample" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span id="btnDlSampleTxt"></span></button>
    </div>
    <div class="fmt" id="fmtBox"></div>
    <div id="dataInfo"></div>
  </section>

  <section class="step locked" id="step3">
    <div class="step-h"><span class="num">3</span><h2 data-th="เลือกตัวแปรและตั้งค่าการวิเคราะห์" data-en="Variables & settings"></h2></div>
    <div id="varBox"></div>
    <div id="setBox"></div>
    <div class="run-row"><button class="btn primary big" id="btnRun" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg><span data-th="ประมวลผล" data-en="Run analysis"></span></button></div>
    <div id="errBox"></div>
  </section>

  <section class="step hidden" id="step4">
    <div class="step-h"><span class="num">4</span><h2 data-th="ผลการวิเคราะห์" data-en="Results"></h2><span class="hint" id="resHint"></span></div>
    <div id="keyBox"></div>
    <div class="res-top">
      <div class="viewseg">
        <button id="vTable" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></svg><span data-th="แสดงผลแบบตาราง" data-en="Table view"></span></button>
        <button id="vChart" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg><span data-th="แสดงผลแบบกราฟ" data-en="Chart view"></span></button>
      </div>
      <button class="btn" id="btnXlsx" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span data-th="ดาวน์โหลดตารางทั้งหมด (Excel)" data-en="Download all tables (Excel)"></span></button>
    </div>
    <div id="resTables"></div>
    <div id="resCharts" class="chart-grid hidden"></div>
  </section>
</main>
<footer data-th="การคำนวณทั้งหมดทำงานในเบราว์เซอร์ของคุณ ไม่มีการส่งข้อมูลออกไปภายนอก · ผลลัพธ์ใช้เพื่อการศึกษาและการวิจัยเบื้องต้น ควรตรวจสอบกับซอฟต์แวร์เฉพาะทาง (EViews, Stata, R, Python) สำหรับงานตีพิมพ์" data-en="All computations run locally in your browser — no data leaves your device · Intended for teaching and exploratory research; cross-check with dedicated software (EViews, Stata, R, Python) for publication."></footer>
<div class="loader hidden" id="loader"><div><span class="spin"></span><span id="loaderTxt"></span></div></div>

<script>
/* ================= Time Series Econometrics Engine ================= */
const TS = (function () {
  'use strict';
  // ---------- basic helpers ----------
  const sum = a => { let s = 0; for (const v of a) s += v; return s; };
  const mean = a => sum(a) / a.length;
  function variance(a, ddof = 1) { const m = mean(a); let s = 0; for (const v of a) s += (v - m) * (v - m); return s / (a.length - ddof); }
  const std = (a, ddof = 1) => Math.sqrt(variance(a, ddof));
  const diff = (a, lag = 1) => { const o = []; for (let i = lag; i < a.length; i++) o.push(a[i] - a[i - lag]); return o; };
  const range = n => Array.from({ length: n }, (_, i) => i);

  // ---------- linear algebra ----------
  function zeros(r, c) { return Array.from({ length: r }, () => new Array(c).fill(0)); }
  function eye(n) { const I = zeros(n, n); for (let i = 0; i < n; i++) I[i][i] = 1; return I; }
  function tr(A) { const r = A.length, c = A[0].length, B = zeros(c, r); for (let i = 0; i < r; i++) for (let j = 0; j < c; j++) B[j][i] = A[i][j]; return B; }
  function mm(A, B) {
    const r = A.length, n = B.length, c = B[0].length, C = zeros(r, c);
    for (let i = 0; i < r; i++) { const Ai = A[i], Ci = C[i]; for (let k = 0; k < n; k++) { const a = Ai[k]; if (a === 0) continue; const Bk = B[k]; for (let j = 0; j < c; j++) Ci[j] += a * Bk[j]; } }
    return C;
  }
  const mv = (A, v) => A.map(r => { let s = 0; for (let j = 0; j < v.length; j++) s += r[j] * v[j]; return s; });
  const madd = (A, B, s = 1) => A.map((r, i) => r.map((v, j) => v + s * B[i][j]));
  const mscale = (A, s) => A.map(r => r.map(v => v * s));
  function inv(A) {
    const n = A.length; let scale = 0;
    for (const r of A) for (const v of r) scale = Math.max(scale, Math.abs(v));
    const M = A.map((r, i) => { const row = r.slice(); for (let j = 0; j < n; j++) row.push(i === j ? 1 : 0); return row; });
    for (let c = 0; c < n; c++) {
      let piv = c, best = Math.abs(M[c][c]);
      for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > best) { best = Math.abs(M[r][c]); piv = r; }
      if (!(best > scale * 1e-14)) throw new Error('SINGULAR');
      if (piv !== c) { const t = M[c]; M[c] = M[piv]; M[piv] = t; }
      const d = M[c][c]; for (let j = 0; j < 2 * n; j++) M[c][j] /= d;
      for (let r = 0; r < n; r++) { if (r === c) continue; const f = M[r][c]; if (f === 0) continue; for (let j = 0; j < 2 * n; j++) M[r][j] -= f * M[c][j]; }
    }
    return M.map(r => r.slice(n));
  }
  function chol(A) {
    const n = A.length, Lm = zeros(n, n);
    for (let i = 0; i < n; i++) for (let j = 0; j <= i; j++) {
      let s = A[i][j]; for (let k = 0; k < j; k++) s -= Lm[i][k] * Lm[j][k];
      if (i === j) { if (s <= 0) throw new Error('NOT_PD'); Lm[i][i] = Math.sqrt(s); } else Lm[i][j] = s / Lm[j][j];
    }
    return Lm;
  }
  function logdet(A) { const Lc = chol(A); let s = 0; for (let i = 0; i < A.length; i++) s += 2 * Math.log(Lc[i][i]); return s; }

  // symmetric eigen (Jacobi) -> {values, vectors(columns)}
  function eigSym(S) {
    const n = S.length, a = S.map(r => r.slice()), V = eye(n);
    for (let sweep = 0; sweep < 100; sweep++) {
      let off = 0; for (let p = 0; p < n; p++) for (let q = p + 1; q < n; q++) off += a[p][q] * a[p][q];
      if (off < 1e-24) break;
      for (let p = 0; p < n; p++) for (let q = p + 1; q < n; q++) {

          L('z-stat = Coef./SE ทดสอบ H₀: สัมประสิทธิ์ = 0; p-value < 0.05 หมายถึงมีนัยสำคัญที่ระดับ 5%', 'z-stat = Coef./SE tests H₀: coefficient = 0; p < 0.05 means significant at 5%.'),
          L('*** p<0.01, ** p<0.05, * p<0.10 — ค่า AR และ MA ถูกบังคับให้อยู่ในเขต stationary / invertible', '*** p<0.01, ** p<0.05, * p<0.10 — AR/MA polynomials are constrained to be stationary/invertible.')] });
      const nar = sp.p + sp.q + sp.P + sp.Q;

          L('Jarque–Bera ทดสอบความเบ้และความโด่ง; หากปฏิเสธ ช่วงพยากรณ์แบบ Normal อาจไม่แม่นยำ', 'Jarque–Bera tests skewness/kurtosis; rejection means Normal-based intervals may be imprecise.'),
          L('ARCH-LM ที่มีนัยสำคัญบ่งชี้ว่าความแปรปรวนเปลี่ยนตามเวลา — พิจารณาใช้ GARCH', 'A significant ARCH-LM points to time-varying variance — consider a GARCH model.'),
          L('ADF ของข้อมูลหลังหาผลต่าง (d, D) ควรนิ่ง เพื่อยืนยันว่าอันดับการหาผลต่างเพียงพอ', 'ADF on the differenced series should indicate stationarity, confirming d and D are sufficient.')] });
      T.push({ title: L('ความแม่นยำในตัวอย่าง (In-sample accuracy)', 'In-sample accuracy'), cols: [C(L('ตัวชี้วัด', 'Metric'), 't'), C(L('ค่า', 'Value')), C(L('ความหมาย', 'Meaning'), 't')], rows: [
        ['RMSE', r.acc.rmse, L('รากที่สองของค่าเฉลี่ยความคลาดเคลื่อนกำลังสอง (หน่วยเดียวกับข้อมูล)', 'Root mean squared error (data units)')],
        ['MAE', r.acc.mae, L('ค่าเฉลี่ยความคลาดเคลื่อนสัมบูรณ์', 'Mean absolute error')],
        ['MAPE (%)', r.acc.mape, L('ร้อยละความคลาดเคลื่อนสัมบูรณ์เฉลี่ย (<10% ดีมาก, 10–20% ดี)', 'Mean absolute percentage error (<10% very good, 10–20% good)')]],
        notes: [L('คำนวณจากค่าพยากรณ์ล่วงหน้า 1 ช่วง (one-step-ahead fitted values) ในหน่วยเดิมของข้อมูล', 'Computed from one-step-ahead fitted values on the original scale.')] });
      T.push({ title: L('ค่าพยากรณ์และช่วงความเชื่อมั่น 95%', 'Forecasts with 95% intervals'), cols: [C(L('งวด', 'Period'), 't'), C('h', 'i'), C(L('ค่าพยากรณ์', 'Forecast')), C(L('ขอบล่าง 95%', 'Lower 95%')), C(L('ขอบบน 95%', 'Upper 95%')), C('SE' + (r.log ? ' (ln)' : ''))],
        rows: r.fmean.map((v, i) => [r.flabels[i], i + 1, v, r.flo[i], r.fhi[i], r.fse[i]]),
        notes: [L('ช่วงพยากรณ์คำนวณจากน้ำหนัก ψ (MA(∞) representation): Var(eₜ₊ₕ) = σ² Σψⱼ²', 'Intervals use ψ-weights of the MA(∞) form: Var(e_{t+h}) = σ² Σψⱼ².'), r.log ? L('ข้อมูลถูกแปลงเป็น ln จึงแปลงกลับด้วย exp() — ค่าพยากรณ์คือค่ามัธยฐาน และช่วงไม่สมมาตร', 'Because ln was used, values are back-transformed with exp() — point forecasts are medians and intervals are asymmetric.') : L('ช่วงพยากรณ์จะกว้างขึ้นเมื่อพยากรณ์ไกลออกไป สะท้อนความไม่แน่นอนที่สะสม', 'Intervals widen with the horizon, reflecting accumulated uncertainty.')] });
      const cb = 1.96 / Math.sqrt(r.w.length);
      T.push({ title: L('ACF และ PACF ของข้อมูลหลังหาผลต่าง', 'ACF & PACF of the differenced series'), cols: [C('Lag', 'i'), C('ACF'), C('PACF'), C('±95% bound'), C(L('นัยสำคัญ', 'Significant'), 't')],
        rows: r.acfW.slice(1).map((v, i) => [i + 1, v, r.pacfW[i + 1], cb, (Math.abs(v) > cb ? 'ACF ' : '') + (Math.abs(r.pacfW[i + 1]) > cb ? 'PACF' : '')]),
        notes: [L('ACF ตัดขาดหลัง lag q → บ่งชี้ MA(q); PACF ตัดขาดหลัง lag p → บ่งชี้ AR(p)', 'ACF cutting off after lag q suggests MA(q); PACF cutting off after lag p suggests AR(p).'), L('ค่าที่ lag ฤดูกาล (เช่น 12, 24) ช่วยกำหนด P และ Q', 'Spikes at seasonal lags (e.g. 12, 24) guide P and Q.')] });

    charts(r) {

  function modelName(sp) { return (sp.s > 1 && (sp.P || sp.D || sp.Q) ? 'SARIMA' : 'ARIMA') + `(${sp.p},${sp.d},${sp.q})` + (sp.s > 1 && (sp.P || sp.D || sp.Q) ? `(${sp.P},${sp.D},${sp.Q})${sp.s}` : '') + (sp.c ? ' + c' : ''); }

  // ===== UNIT ROOT =====
  MODS.unitroot = {
    tag: 'ADF · PP · KPSS', vars: 'multi', minVars: 1, maxVars: 12,
    name: () => L('การทดสอบ Unit Root และความนิ่ง', 'Unit Root Tests & Stationarity'),
    short: () => L('ทดสอบความนิ่งของข้อมูลด้วย ADF, Phillips–Perron และ KPSS เพื่อป้องกัน Spurious Regression', 'Test stationarity with ADF, Phillips–Perron and KPSS to avoid spurious regression'),
    info: () => ({
      purpose: L('ตรวจสอบว่าอนุกรมเวลานิ่ง (stationary) หรือมี unit root ก่อนนำไปสร้างแบบจำลอง เพื่อหลีกเลี่ยงความสัมพันธ์ลวง (Spurious Regression) และกำหนดอันดับ Integration I(d)', 'Checks whether each series is stationary or has a unit root before modelling, avoiding spurious regression and identifying the order of integration I(d).'),
      eq: 'ADF: Δyₜ = α + βt + γyₜ₋₁ + Σδᵢ Δyₜ₋ᵢ + εₜ   (H₀: γ = 0)',

      data: L('ตัวแปร 1 ตัวขึ้นไป แต่ละตัวอย่างน้อย 20 ค่า (แนะนำ ≥ 50)', 'One or more variables, ≥ 20 observations each (≥ 50 recommended).')
    }),
    settings: [
      { id: 'spec', type: 'sel', th: 'รูปแบบสมการ (ระดับ)', en: 'Deterministic terms (levels)', def: 'c', opts: [['c', 'ค่าคงที่ (Intercept)', 'Intercept'], ['ct', 'ค่าคงที่ + แนวโน้ม (Trend & intercept)', 'Trend & intercept']] },
      { id: 'ic', type: 'sel', th: 'เกณฑ์เลือก Lag (ADF)', en: 'ADF lag criterion', def: 'AIC', opts: [['AIC', 'AIC', 'AIC'], ['BIC', 'BIC (SC)', 'BIC (SC)']] },

    summary(r) {
      return r.items.map(it => L(`${it.name}: ${ordTxt(it.overall)} — ADF p(ระดับ) = ${fp(it.level.adf.p)}, KPSS = ${fnum(it.level.kpss.stat, 3)} → ${it.overall === 0 ? 'นิ่งที่ระดับ (Level)' : it.overall === 1 ? 'นิ่งหลังหาผลต่างอันดับ 1' : 'ยังไม่นิ่งแม้หาผลต่างอันดับ 1'}`,
        `${it.name}: ${ordTxt(it.overall)} — ADF p(level) = ${fp(it.level.adf.p)}, KPSS = ${fnum(it.level.kpss.stat, 3)} → ${it.overall === 0 ? 'stationary in levels' : it.overall === 1 ? 'stationary after first differencing' : 'not stationary even after first differencing'}`));
    },
    tables(r) {
      const a = r.alpha, T = [], lvS = specName(r.spec), dS = specName('c'), Lv = L('ระดับ (Level)', 'Level'), Df = L('ผลต่างอันดับ 1 (Δ)', 'First difference');
      T.push({ title: L('สรุปผลการทดสอบความนิ่ง', 'Stationarity summary'), cols: [C(L('ตัวแปร', 'Variable'), 't'), C('ADF p (Level)', 'p'), C('PP p (Level)', 'p'), C('KPSS (Level)', 'n3'), C('ADF p (Δ)', 'p'), C('PP p (Δ)', 'p'), C('KPSS (Δ)', 'n3'), C('ADF / PP / KPSS', 't'), C(L('สรุป', 'Conclusion'), 't')],
        rows: r.items.map(it => [it.name, it.level.adf.p, it.level.pp.p, it.level.kpss.stat, it.diff.adf.p, it.diff.pp.p, it.diff.kpss.stat, `${ordTxt(it.order.adf)} / ${ordTxt(it.order.pp)} / ${ordTxt(it.order.kpss)}`, { v: ordTxt(it.overall), cls: it.overall === 0 ? 'ok' : 'strong' }]),
        notes: [L(`ระดับนัยสำคัญ ${pctA(a)}; ADF และ PP มี H₀: มี unit root (ไม่นิ่ง) — p-value < ${a} ⇒ นิ่ง`, `Significance ${pctA(a)}; ADF and PP have H₀: unit root (non-stationary) — p < ${a} ⇒ stationary.`),
          L('KPSS มี H₀: นิ่ง — ค่าสถิติ > ค่าวิกฤต ⇒ ไม่นิ่ง; การใช้ทดสอบทั้งสองแนวทางช่วยยืนยันผล (confirmatory analysis)', 'KPSS has H₀: stationary — statistic > critical value ⇒ non-stationary; combining both approaches gives a confirmatory analysis.'),
          L('I(0) = นิ่งที่ระดับ, I(1) = นิ่งหลังหาผลต่าง 1 ครั้ง; ข้อสรุปรวมใช้เสียงข้างมากของ 3 การทดสอบ', 'I(0) = stationary in levels, I(1) = stationary after one difference; the overall conclusion is the majority of the three tests.'),

        rows: r.items.flatMap(it => [adfRow(it, it.level, Lv, lvS, it.stL.adf), adfRow(it, it.diff, Df, dS, it.stD.adf)]),
        notes: [L('ADF: Δyₜ = α (+βt) + γyₜ₋₁ + Σδᵢ Δyₜ₋ᵢ + εₜ ทดสอบ H₀: γ = 0 (มี unit root) กับ H₁: γ < 0', 'ADF regression Δyₜ = α (+βt) + γyₜ₋₁ + Σδᵢ Δyₜ₋ᵢ + εₜ tests H₀: γ = 0 (unit root) vs H₁: γ < 0.'),
          L(`จำนวน Lag เลือกด้วย ${r.ic} (สูงสุด 12(T/100)^¼) เพื่อขจัดสหสัมพันธ์ในตัวของค่าคลาดเคลื่อน`, `Lags chosen by ${r.ic} (max 12(T/100)^¼) to remove serial correlation.`),
          L('τ-stat ติดลบมากกว่าค่าวิกฤต (CV) ⇒ ปฏิเสธ H₀ ⇒ อนุกรมนิ่ง; ค่าวิกฤตจาก MacKinnon (2010)', 'τ more negative than the critical value ⇒ reject H₀ ⇒ stationary; CVs from MacKinnon (2010).'),
          L('γ̂ คือสัมประสิทธิ์ของ yₜ₋₁ ซึ่งเท่ากับ (ρ − 1)', 'γ̂ is the coefficient on yₜ₋₁, i.e. (ρ − 1).')] });
      const ppRow = (it, R, ser, sp, ok) => [it.name, ser, sp, R.pp.lags, R.pp.nobs, R.pp.stat, R.pp.Za, R.pp.p, R.pp.cv[1], dec(ok, stTxt(true), stTxt(false))];
      T.push({ title: 'Phillips–Perron (PP)', cols: [C(L('ตัวแปร', 'Variable'), 't'), C(L('อนุกรม', 'Series'), 't'), C(L('รูปแบบ', 'Spec'), 't'), C('Bandwidth', 'i'), C('Obs', 'i'), C('Z(t)', 'n3'), C('Z(α)', 'n3'), C('p-value', 'p'), C('CV 5%', 'n3'), C(L('ผล', 'Result'), 't')],
        rows: r.items.flatMap(it => [ppRow(it, it.level, Lv, lvS, it.stL.pp), ppRow(it, it.diff, Df, dS, it.stD.pp)]),
        notes: [L('PP ปรับค่าสถิติ t แบบ non-parametric ด้วยความแปรปรวนระยะยาว (Newey–West, Bartlett kernel) แทนการเพิ่ม lag', 'PP corrects the t-statistic non-parametrically using a Newey–West (Bartlett) long-run variance instead of adding lags.'),
          L('ทนทานต่อ heteroskedasticity และ autocorrelation; H₀: มี unit root; ใช้ค่าวิกฤตเดียวกับ ADF', 'Robust to heteroskedasticity/autocorrelation; H₀: unit root; same critical values as ADF.'),
          L('Z(α) = T(ρ̂ − 1) ที่ปรับแก้แล้ว รายงานเพื่อการอ้างอิง', 'Z(α) = corrected T(ρ̂ − 1), reported for reference.')] });
      const kRow = (it, R, ser, sp, ok) => [it.name, ser, sp, R.kpss.lags, R.kpss.stat, R.kpss.cv[0], R.kpss.cv[1], R.kpss.cv[3], R.kpss.ptxt, dec(ok, stTxt(true), stTxt(false))];
      T.push({ title: 'KPSS', cols: [C(L('ตัวแปร', 'Variable'), 't'), C(L('อนุกรม', 'Series'), 't'), C(L('รูปแบบ', 'Spec'), 't'), C('Bandwidth', 'i'), C('LM-stat', 'n3'), C('CV 10%', 'n3'), C('CV 5%', 'n3'), C('CV 1%', 'n3'), C('p-value', 't'), C(L('ผล', 'Result'), 't')],
        rows: r.items.flatMap(it => [kRow(it, it.level, Lv, lvS, it.stL.kpss), kRow(it, it.diff, Df, dS, it.stD.kpss)]),
        notes: [L('KPSS (Kwiatkowski–Phillips–Schmidt–Shin) มี H₀: อนุกรมนิ่ง — ตรงข้ามกับ ADF/PP', 'KPSS has H₀: the series is stationary — the reverse of ADF/PP.'),
          L('LM-stat มากกว่าค่าวิกฤต ⇒ ปฏิเสธความนิ่ง; p-value ประมาณค่าโดย interpolation จากตารางค่าวิกฤต', 'LM-stat above the critical value ⇒ reject stationarity; p-values are interpolated from the critical-value table.')] });
      T.push({ title: L('สถิติเชิงพรรณนา (ข้อมูลระดับ)', 'Descriptive statistics (levels)'), cols: [C(L('ตัวแปร', 'Variable'), 't'), C('N', 'i'), C(L('ค่าเฉลี่ย', 'Mean')), C('S.D.'), C('Min'), C('Max'), C('Skewness', 'n3'), C('Kurtosis', 'n3'), C('Jarque–Bera', 'n3'), C('p-value', 'p')],

    charts(r) {

        out.push(acfSpec(`ACF — ${it.name} (Level)`, it.acfL, it.y.length, c));
        out.push(acfSpec(`ACF — Δ${it.name}`, it.acfD, it.dy.length, c));

        Object.assign(hline(L('ค่าวิกฤต 5% (ประมาณ)', '5% critical value (approx.)'), names.length, cv, '#c03535'), { borderWidth: 2 })
      ], { wide: true, sub: L('แท่งที่ต่ำกว่าเส้นสีแดง ⇒ ปฏิเสธ unit root', 'Bars below the red line ⇒ reject the unit root') }));
      return out;
    }

  // ===== COINTEGRATION =====
  MODS.coint = {
    tag: 'Engle–Granger · Johansen · ECM', vars: 'multi', minVars: 2, maxVars: 4,
    name: () => L('Cointegration และ Error Correction Model (ECM)', 'Cointegration & Error Correction Model (ECM)'),
    short: () => L('ทดสอบความสัมพันธ์ระยะยาวของตัวแปรที่ไม่นิ่ง ด้วยวิธี Engle–Granger และ Johansen พร้อม ECM', 'Test long-run relations among non-stationary variables (Engle–Granger, Johansen) with an ECM'),
    info: () => ({
      purpose: L('ตรวจสอบว่าตัวแปร I(1) หลายตัวมีความสัมพันธ์เชิงดุลยภาพระยะยาวร่วมกันหรือไม่ และวัดความเร็วในการปรับตัวกลับสู่ดุลยภาพผ่าน Error Correction Model', 'Checks whether several I(1) variables share a long-run equilibrium and measures the speed of adjustment back to it with an error correction model.'),
      eq: 'ECM: Δyₜ = c + Σβⱼ Δxⱼₜ + γ·ECTₜ₋₁ + … + εₜ,  ECTₜ = yₜ − α̂ − Σθ̂ⱼ xⱼₜ',
      method: L('Engle–Granger 2 ขั้น (ค่าวิกฤต MacKinnon 2010), Johansen trace / max-eigenvalue (ค่าคงที่ไม่จำกัด) และ ECM ด้วย OLS', 'Engle–Granger two-step (MacKinnon 2010 CVs), Johansen trace / max-eigenvalue (unrestricted constant) and an OLS ECM.'),
      data: L('2–4 ตัวแปร (ตัวแรกที่เลือก = ตัวแปรตามใน Engle–Granger/ECM) ควรเป็น I(1)', '2–4 variables (first selected = dependent variable in Engle–Granger/ECM), ideally I(1).')
    }),
    settings: [
      { id: 'eclag', type: 'num', th: 'จำนวน Lag ของ Δ ใน ECM', en: 'Lagged Δ terms in ECM', def: 1, min: 0, max: 6 },
      { id: 'jlag', type: 'num', th: 'Lag ของ VAR (Johansen)', en: 'VAR lag order (Johansen)', def: 2, min: 1, max: 8 },
      { id: 'alpha', type: 'sel', th: 'ระดับนัยสำคัญ', en: 'Significance level', def: '0.05', opts: alphaOpts }
    ],
    run: (D, s) => TS.runCoint(D, s),
    summary(r) {
      const o = [];
      o.push(L(`Engle–Granger: τ = ${fnum(r.eg.adf.stat, 3)} (CV 5% = ${fnum(r.eg.adf.cv[1], 3)}, p ≈ ${r.eg.p.txt}) → ${r.eg.coint ? 'มี Cointegration' : 'ไม่พบ Cointegration'}`, `Engle–Granger: τ = ${fnum(r.eg.adf.stat, 3)} (5% CV = ${fnum(r.eg.adf.cv[1], 3)}, p ≈ ${r.eg.p.txt}) → ${r.eg.coint ? 'cointegrated' : 'no cointegration'}`));
      if (r.joh) o.push(L(`Johansen (Trace): จำนวนเวกเตอร์ Cointegration r = ${r.joh.rankT} ; (Max-eigen): r = ${r.joh.rankM}`, `Johansen trace test: cointegrating rank r = ${r.joh.rankT}; max-eigenvalue: r = ${r.joh.rankM}`));
      o.push(L(`ECM: ค่าสัมประสิทธิ์ ECT(-1) = ${fnum(r.ecm.gamma, 4)} (p = ${fp(r.ecm.gp)}) ${r.ecm.gamma < 0 && r.ecm.gp < 0.05 ? `→ ปรับตัวเข้าสู่ดุลยภาพ ${fnum(-r.ecm.gamma * 100, 1)}% ต่องวด, Half-life ≈ ${fnum(r.ecm.hl, 2)} งวด` : '→ ไม่พบการปรับตัวที่มีนัยสำคัญ'}`, `ECM: ECT(-1) coefficient = ${fnum(r.ecm.gamma, 4)} (p = ${fp(r.ecm.gp)}) ${r.ecm.gamma < 0 && r.ecm.gp < 0.05 ? `→ ${fnum(-r.ecm.gamma * 100, 1)}% of disequilibrium corrected per period; half-life ≈ ${fnum(r.ecm.hl, 2)} periods` : '→ no significant error correction'}`));
      return o;
    },
    tables(r) {
      const T = [], a = r.alpha, nm = r.names, eg = r.eg, lr = eg.lr;

      T.push({ title: L('Engle–Granger ขั้นที่ 1: สมการระยะยาว (Long-run)', 'Engle–Granger step 1: long-run regression'), cols: [C(L('ตัวแปรอิสระ', 'Regressor'), 't'), C('Coef.'), C('Std. Error'), C('t-stat', 'n3'), C('p-value', 'p'), C('Sig.', 't')],

        rows: [[eg.adf.stat, eg.adf.lags, eg.adf.nobs, eg.adf.cv[0], eg.adf.cv[1], eg.adf.cv[2], eg.p.txt, dec(eg.coint, L('มี Cointegration', 'Cointegrated'), L('ไม่มี Cointegration', 'Not cointegrated'))]],

          L(`τ < ค่าวิกฤต ${pctA(a)} ⇒ ปฏิเสธ H₀ ⇒ ตัวแปรมีความสัมพันธ์ระยะยาว`, `τ below the ${pctA(a)} critical value ⇒ reject H₀ ⇒ a long-run relationship exists.`)] });
      const e = r.ecm.fit;

        rows: r.ecm.names.map((n, j) => [{ v: n, cls: n === 'ECT(-1)' ? 'strong' : '' }, e.b[j], e.se[j], e.t[j], e.p[j], star(e.p[j])]),

      if (r.joh) {

          notes: [L('λ-max = −T ln(1−λᵣ₊₁) ทดสอบ H₀: rank = r กับ H₁: rank = r+1', 'λ-max = −T ln(1−λᵣ₊₁) tests H₀: rank = r against H₁: rank = r+1.'), L(`ผลลัพธ์: rank = ${J.rankM}; หาก Trace และ Max-eigen ขัดแย้งกัน มักให้น้ำหนักกับ Trace test`, `Result: rank = ${J.rankM}; if trace and max-eigen disagree, the trace test is usually preferred.`)] });

          rows: nm.map((n, i) => [n, ...range(J.useR).map(c => J.betaN[i][c])]),
          notes: [L('ปรับมาตรฐานให้ตัวแปรแรกมีค่า 1: ECT = y₁ + β₂y₂ + … ⇒ ความสัมพันธ์ระยะยาว y₁ = −β₂y₂ − …', 'Normalised on the first variable: ECT = y₁ + β₂y₂ + … ⇒ long run y₁ = −β₂y₂ − …'),
            L('เครื่องหมายของ β ตรงข้ามกับความสัมพันธ์ระยะยาว (เช่น β₂ = −0.9 ⇒ y₁ เพิ่ม 0.9 เมื่อ y₂ เพิ่ม 1)', 'Signs are reversed relative to the long-run relation (e.g. β₂ = −0.9 ⇒ y₁ rises 0.9 when y₂ rises 1).')] });
        T.push({ title: L('ค่าสัมประสิทธิ์การปรับตัว (α) จาก VECM', 'Adjustment coefficients (α) from the VECM'), cols: [C(L('สมการ', 'Equation'), 't'), C('ECT', 't'), C('α'), C('Std. Error'), C('t-stat', 'n3'), C('p-value', 'p'), C('Sig.', 't')],
          rows: J.alphaEq.flatMap((eqA, i) => eqA.map((x, c) => ['Δ' + nm[i], 'ECT' + (c + 1), x.coef, x.se, x.t, x.p, star(x.p)])),
          notes: [L('α แสดงว่าตัวแปรใดปรับตัวเมื่อเกิดความคลาดเคลื่อนจากดุลยภาพ; α ไม่มีนัยสำคัญ ⇒ ตัวแปรนั้นเป็น weakly exogenous', 'α shows which variables adjust to disequilibrium; an insignificant α means that variable is weakly exogenous.')] });

    charts(r) {

      const lab = r.ecm.idx.map(t => r.labels[t]);

        out.push(barSpec(L('Johansen Max-eigen statistic เทียบค่าวิกฤต 5%', 'Johansen max-eigen statistic vs 5% CV'), J.maxe.map(t => 'r = ' + t.r), [ds('λ-max', J.maxe.map(t => t.stat), PAL[4] + 'cc', { borderWidth: 0 }), ds('CV 5%', J.maxe.map(t => t.cv[1]), '#c03535', { type: 'line', borderWidth: 2, pointRadius: 4, borderDash: [5, 3] })]));

    info: () => ({

      data: L('2–6 ตัวแปร; VAR ควรใช้ข้อมูลนิ่ง (หรือแปลงเป็นผลต่าง/อัตราการเปลี่ยนแปลง), VECM ใช้ข้อมูลระดับที่เป็น I(1)', '2–6 variables; a VAR should use stationary data (or differences/growth rates), a VECM uses I(1) levels.')

  function transName(t) { return { none: L('ระดับ (ไม่แปลง)', 'Levels'), diff: L('ผลต่างอันดับ 1', 'First difference'), log: 'ln(y)', logdiff: 'Δln(y)×100' }[t] || t; }

      notes: [L(`Rank ที่ใช้ = ${r.r} (${String(r.r) === String(r.rankAuto) ? 'ตามผลทดสอบ' : 'กำหนดโดยผู้ใช้'})`, `Rank used = ${r.r} (${String(r.r) === String(r.rankAuto) ? 'from the test' : 'user-specified'})`)] });

      notes: [L('ECTⱼ = β′ⱼ yₜ₋₁ คือความคลาดเคลื่อนจากดุลยภาพระยะยาว (ตัวแปรแรก r ตัวถูกปรับให้เป็นเมทริกซ์เอกลักษณ์)', 'ECTⱼ = β′ⱼ yₜ₋₁ is the deviation from long-run equilibrium (first r variables normalised to identity).')] });
    const rn = [...range(v.r).map(c => 'ECT' + (c + 1) + '(-1)'), ...range(v.p - 1).flatMap(l => nm.map(x => `Δ${x}(-${l + 1})`)), 'const'];

      rows: rn.map((n, j) => [{ v: n, cls: j < v.r ? 'strong' : '' }, e.b[j], e.se[j], e.t[j], e.p[j], star(e.p[j])]),
      notes: [L(`R² = ${fnum(e.r2)}, Adj. R² = ${fnum(e.adjr2)}, DW = ${fnum(e.dw, 3)}, N = ${e.n}`, `R² = ${fnum(e.r2)}, Adj. R² = ${fnum(e.adjr2)}, DW = ${fnum(e.dw, 3)}, N = ${e.n}`), L('ค่าสัมประสิทธิ์ของ ECT คือ α (speed of adjustment) — ค่าลบและมีนัยสำคัญหมายถึงตัวแปรนั้นปรับตัวกลับสู่ดุลยภาพ; ΔX(-i) คือผลระยะสั้น Γ', 'ECT coefficients are α (speed of adjustment) — negative and significant means the variable corrects toward equilibrium; ΔX(-i) terms are short-run Γ effects.')] }));
    return T;
  }

  function renderModules() {
    $('#modGrid').innerHTML = order.map(id => { const m = MODS[id]; return `<button type="button" class="mod${state.module === id ? ' on' : ''}" data-mod="${id}"><span class="tag">${esc(m.tag)}</span><b>${esc(m.name())}</b><span class="d">${esc(m.short())}</span></button>`; }).join('');
    $$('#modGrid .mod').forEach(b => b.addEventListener('click', () => selectModule(b.dataset.mod)));
    const box = $('#modInfo');
    if (!state.module) { box.classList.add('hidden'); return; }
    const m = MODS[state.module], i = m.info();
    box.classList.remove('hidden');
    box.innerHTML = `<h3>${esc(m.name())}</h3><div class="grid">
      <div><b>${L('วัตถุประสงค์', 'Purpose')}</b>${esc(i.purpose)}</div>

  function selectModule(id) {
    if (state.module !== id) { state.module = id; clearResults(); }

    if (state.data) { initSel(); $('#step3').classList.remove('locked'); }

  // ---------------- data handling ----------------
  function parseAoa(aoa) {
    const rows = aoa.filter(r => r && r.some(c => c !== null && c !== undefined && String(c).trim() !== ''));
    if (rows.length < 3) throw new Error(L('ไฟล์มีข้อมูลน้อยเกินไป', 'The file has too few rows'));
    const width = Math.max(...rows.map(r => r.length));
    const header = range(width).map(i => { const h = rows[0][i]; return h == null || String(h).trim() === '' ? 'V' + (i + 1) : String(h).trim(); });
    const body = rows.slice(1);
    const toNum = v => { if (typeof v === 'number') return isFinite(v) ? v : NaN; if (v == null) return NaN; const s = String(v).trim().replace(/,/g, ''); if (s === '') return NaN; const n = Number(s); return isFinite(n) ? n : NaN; };
    const c0 = body.map(r => r[0]);
    const dateHdr = /date|time|period|year|month|quarter|day|week|วัน|เดือน|ปี|ไตรมาส|ช่วง|เวลา|สัปดาห์/i.test(header[0]);
    const nonNum0 = c0.filter(v => v != null && v !== '' && isNaN(toNum(v))).length;
    const labelCol = dateHdr || nonNum0 > 0.5 * c0.length ? 0 : -1;
    const cols = {}, names = [];
    for (let j = 0; j < width; j++) {
      if (j === labelCol) continue;
      const x = body.map(r => toNum(r[j])); const ok = x.filter(v => !isNaN(v)).length;

    const fr = new FileReader();
    fr.onload = e => {
      try { const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' }); const ws = wb.Sheets[wb.SheetNames[0]]; const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null }); setData(parseAoa(aoa), file.name, false); }
      catch (err) { console.error(err); showErr(L('อ่านไฟล์ไม่สำเร็จ: ', 'Could not read the file: ') + err.message); $('#step3').classList.remove('locked'); }
    };
    fr.readAsArrayBuffer(file);
  }

  // ---------------- reset & language ----------------
  function resetAll() {
    clearResults(); state.module = null; state.data = null; state.source = null; state.settings = {}; state.sel = {};
    $('#fileIn').value = ''; $('#dataInfo').innerHTML = ''; $('#varBox').innerHTML = ''; $('#setBox').innerHTML = ''; showErr('');
    $('#step2').classList.add('locked'); $('#step3').classList.add('locked'); $('#step2hint').classList.remove('hidden');
    renderModules(); applyStatic(); window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function setLang(l) {
    LANG = l; try { localStorage.setItem('tse-lang', l); } catch (e) { /* ignore */ }
    applyStatic(); renderModules(); renderDataInfo(); renderVars(); renderSettings();
    if (state.result) renderResults();
  }

  // ---------------- init ----------------
  function init() {
    if (window.Chart) {
      Chart.defaults.font.family = "'IBM Plex Sans Thai', system-ui, sans-serif";
      Chart.register({ id: 'bgWhite', beforeDraw(c) { const x = c.ctx; x.save(); x.globalCompositeOperation = 'destination-over'; x.fillStyle = '#ffffff'; x.fillRect(0, 0, c.width, c.height); x.restore(); } });
    }
    $('#btnTH').addEventListener('click', () => setLang('th')); $('#btnEN').addEventListener('click', () => setLang('en'));
    $('#btnReset').addEventListener('click', resetAll);
    $('#btnSample').addEventListener('click', loadSample); $('#btnDlSample').addEventListener('click', downloadSample);
    $('#fileIn').addEventListener('change', e => readFile(e.target.files[0]));
    const dz = $('#drop');
    ['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('over'); }));
    dz.addEventListener('drop', e => { const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) readFile(f); });
    $('#btnRun').addEventListener('click', runAnalysis);
    $('#vTable').addEventListener('click', () => setView('table')); $('#vChart').addEventListener('click', () => setView('chart'));
    $('#btnXlsx').addEventListener('click', downloadTables);
    applyStatic(); renderModules();
    if (!window.Chart || !window.XLSX) showErr(L('ไม่สามารถโหลดไลบรารีกราฟ/Excel จากอินเทอร์เน็ตได้ — บางฟังก์ชันอาจใช้งานไม่ได้', 'Chart/Excel libraries failed to load from the internet — some features may not work.'));
  }
  window.__TSE = { state, MODS, setLang, loadSample, runAnalysis, selectModule, setView, downloadTables, parseAoa };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body>
</html>
